<!doctype html>
<html lang="vi">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description"
		content="Tin tức điện ảnh mới nhất, ưu đãi giảm giá vé xem phim, combo bắp nước và chương trình thành viên độc quyền tại Beta Cinemas." />
	<title>Tin Mới & Khuyến Mãi | Beta Cinemas</title>
	<link rel="stylesheet" href="/style/main.scss" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
		rel="stylesheet" />
	<script>
		(function () {
			const t = localStorage.getItem("beta_theme") || "mocha";
			document.documentElement.setAttribute("data-theme", t);
			document.documentElement.style.colorScheme = t === "latte" ? "light" : "dark";
		})();
	</script>
</head>

<body class="pricing-page news-page">
	<!-- ===================== HEADER ===================== -->
	<header class="main-header">
		<div class="header-account-manager">
			<div class="container">
				<a href="#" id="btn-login">Đăng nhập</a>
				<div class="divider"></div>
				<a href="#" id="btn-register">Đăng ký</a>
				<div class="divider"></div>
				<button type="button" class="theme-toggle-btn" id="theme-toggle-btn" role="switch" aria-checked="true"
					aria-label="Chuyển chế độ Giao diện Sáng / Tối"
					title="Chuyển chế độ Giao diện Sáng (Latte) / Tối (Mocha)">
					<span class="theme-toggle-track">
						<span class="theme-track-icon theme-track-icon-sun" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
								stroke-linecap="round" stroke-linejoin="round">
								<circle cx="12" cy="12" r="5" fill="currentColor"></circle>
								<line x1="12" y1="1" x2="12" y2="3"></line>
								<line x1="12" y1="21" x2="12" y2="23"></line>
								<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
								<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
								<line x1="1" y1="12" x2="3" y2="12"></line>
								<line x1="21" y1="12" x2="23" y2="12"></line>
								<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
								<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
							</svg>
						</span>
						<span class="theme-track-icon theme-track-icon-moon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
								<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
							</svg>
						</span>
						<span class="theme-toggle-thumb">
							<svg class="theme-thumb-icon theme-thumb-moon" viewBox="0 0 24 24" fill="currentColor"
								stroke="none" aria-hidden="true">
								<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
							</svg>
							<svg class="theme-thumb-icon theme-thumb-sun" viewBox="0 0 24 24" fill="none"
								stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
								aria-hidden="true">
								<circle cx="12" cy="12" r="5" fill="currentColor"></circle>
								<line x1="12" y1="1" x2="12" y2="3"></line>
								<line x1="12" y1="21" x2="12" y2="23"></line>
								<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
								<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
								<line x1="1" y1="12" x2="3" y2="12"></line>
								<line x1="21" y1="12" x2="23" y2="12"></line>
								<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
								<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
							</svg>
						</span>
					</span>
				</button>
				<div class="divider"></div>
				<button type="button" class="lang-toggle-btn" id="lang-toggle-btn" title="Chuyển sang English"
					aria-label="Chuyển sang English">
					<span class="lang-flag">🇬🇧</span>
					<span class="lang-code">EN</span>
				</button>
			</div>
		</div>
		<div class="header-navigator">
			<div class="container">
				<a href="/" class="header-logo" id="logo-link">
					<img src="/logo.webp" alt="Beta Cinemas Logo" />
				</a>
				<div class="cinema-selector-wrap" id="cinema-selector-wrap">
					<button class="cinema-selector" id="cinema-selector-btn" aria-haspopup="listbox"
						aria-expanded="false">
						<span class="cinema-selector-label" id="cinema-selector-label">Beta Thái Nguyên</span>
						<svg class="cinema-selector-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
							<polyline points="6 9 12 15 18 9"></polyline>
						</svg>
					</button>
					<div class="cinema-dropdown" id="cinema-dropdown" role="listbox">
						<ul id="cinema-dropdown-ul"></ul>
					</div>
				</div>
				<nav class="nav-links">
					<a href="/schedule.html" id="nav-schedule">Lịch Chiếu Theo Rạp</a>
					<a href="/movies.html" id="nav-movies">Phim</a>
					<a href="/cinemas.html" id="nav-cinemas">Rạp</a>
					<a href="/pricing.html" id="nav-pricing">Giá Vé</a>
					<a href="/news.html" id="nav-news" class="active">Tin Mới Và Ưu Đãi</a>

					<a href="/member.html" id="nav-member">Thành Viên</a>
					<a href="/admin.html" id="nav-admin" class="admin-only"
						style="display: none; color: #fab387; font-weight: 700;">⚙️ Quản Trị</a>
				</nav>
			</div>
		</div>
	</header>

	<!-- ===================== BREADCRUMB BAR ===================== -->
	<div class="booking-header-bar" style="padding: 14px 0;">
		<div class="container">
			<nav class="booking-breadcrumb" aria-label="Breadcrumb">
				<a href="/">Trang chủ</a>
				<span class="bc-separator">/</span>
				<span class="bc-current">Tin Mới & Ưu Đãi</span>
			</nav>
		</div>
	</div>

	<!-- ===================== MAIN CONTENT ===================== -->
	<main class="container">
		<section class="promotions-section-container" style="margin-top: 32px;">
			<div class="promotions-header-bar">
				<div>
					<h1
						style="font-size: 28px; font-weight: 900; color: #89b4fa; margin: 0 0 8px; text-transform: uppercase;">
						Tin Mới & Chương Trình Khuyến Mãi
					</h1>
					<p style="font-size: 14px; color: #a6adc8; margin: 0;">
						Cập nhật liên tục các ưu đãi vé phim hot nhất, mã voucher bắp nước và sự kiện điện ảnh đặc biệt
						tại Beta Cinemas.
					</p>
				</div>
			</div>

			<!-- Category Filter Pills -->
			<div class="promo-filter-pills" role="tablist" style="margin-top: 24px;">
				<button class="promo-pill active" data-category="all">Tất Cả Ưu Đãi</button>
				<button class="promo-pill" data-category="promotion">Khuyến Mãi Vé</button>
				<button class="promo-pill" data-category="member">Ưu Đãi Thành Viên</button>
				<button class="promo-pill" data-category="news">Tin Tức Rạp</button>
			</div>

			<!-- Promotions Grid -->
			<div class="promotions-grid" id="promotions-grid-container">
				<!-- Dynamically injected via news-page.js -->
			</div>
		</section>
	</main>

	<!-- ===================== PROMO DETAIL MODAL ===================== -->
	<div class="modal-backdrop" id="promo-detail-modal">
		<div class="modal-content" style="max-width: 680px; padding: 0; overflow: hidden;">
			<button class="modal-close-btn" id="promo-modal-close" aria-label="Đóng">&#x2715;</button>
			<div id="promo-modal-body">
				<!-- Rendered dynamically -->
			</div>
		</div>
	</div>

	<!-- ===================== FOOTER ===================== -->
	<footer class="main-footer" id="footer-container"></footer>

	<!-- Scripts -->
	<script type="module" src="/js/news-page.js"></script>
</body>

</html>
